<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
  <title>entropy · disorder, uncertainty & perspective</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5f2eb;
      font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      color: #2e241f;
      line-height: 1.5;
    }

    .container {
      max-width: 750px;
      width: 100%;
      background: rgba(255, 251, 245, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      padding: 2rem 2rem 2.2rem;
      box-shadow: 0 25px 45px rgba(0,0,0,0.08), 0 10px 20px rgba(0,0,0,0.05);
      border: 1px solid #ede3d3;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    h1 {
      font-weight: 500;
      font-size: 2.2rem;
      letter-spacing: -0.5px;
      color: #4a3729;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border-bottom: 2px solid #e7d7c0;
      padding-bottom: 0.7rem;
    }
    h1 span {
      background: #e7d7c0;
      padding: 0.2rem 0.9rem;
      border-radius: 3rem;
      font-size: 1.3rem;
      font-weight: 400;
      margin-left: 0.5rem;
    }

    .stage-area {
      background: #fffbf5;
      border-radius: 2rem;
      padding: 1.6rem 1.6rem 1.2rem;
      box-shadow: inset 0 1px 8px rgba(0,0,0,0.02);
      border: 1px solid #e1d6c7;
    }

    .description {
      font-size: 1.1rem;
      color: #5e4c3b;
      margin-bottom: 1.5rem;
      font-weight: 400;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .highlight {
      font-weight: 600;
      color: #7b5e3b;
      background: #f3ede4;
      padding: 0.1rem 0.6rem;
      border-radius: 1rem;
    }

    .grid-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0.8rem 0 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.7rem;
      background: #d9cdb8;
      padding: 1rem;
      border-radius: 1.5rem;
      max-width: 350px;
      width: 100%;
      margin: 0 auto;
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
    }

    .cell {
      aspect-ratio: 1 / 1;
      background: #faf7f0;
      border-radius: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      cursor: pointer;
      font-size: 1.6rem;
      font-weight: 500;
      color: #5e3a2c;
      border: 2px solid #e7d7c0;
    }

    .cell.particle {
      background: #b76e4a;
      background: linear-gradient(145deg, #c07a56, #9f5d3c);
      border: 2px solid #8b4e31;
      box-shadow: 0 4px 8px rgba(160, 100, 60, 0.4);
      color: white;
    }

    .cell.revealed {
      background: #ebd6c0;
      border: 2px solid #c4a78b;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 1.2rem 0.5rem 0.8rem;
      font-weight: 500;
      color: #4e3b2c;
    }

    .progress-badge {
      background: #e4d5c2;
      padding: 0.3rem 1rem;
      border-radius: 2rem;
      font-size: 0.9rem;
    }

    .entropy-bar {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin: 0.8rem 0 0.5rem;
      font-size: 0.9rem;
    }
    .bar-track {
      flex: 1;
      height: 8px;
      background: #ddd2c1;
      border-radius: 10px;
      overflow: hidden;
    }
    .bar-fill {
      width: 0%;
      height: 100%;
      background: #b1754b;
      border-radius: 10px;
      transition: width 0.4s ease;
    }
    .low-high {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.8rem;
      color: #6b5b4b;
      margin-top: 0.2rem;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    button {
      background: #ffffff;
      border: 1.5px solid #cfbc9f;
      padding: 0.7rem 1.6rem;
      border-radius: 2.5rem;
      font-weight: 550;
      font-size: 0.95rem;
      color: #4f3b28;
      cursor: pointer;
      background: #fcf9f4;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    button:hover {
      background: #ede3d3;
      border-color: #b1977a;
      box-shadow: 0 5px 12px rgba(0,0,0,0.06);
    }

    button:active {
      background: #ddd0bb;
    }

    button.primary {
      background: #c9af8b;
      border-color: #8b7256;
      color: #2d241a;
      font-weight: 600;
    }

    .step-indicator {
      font-weight: 500;
      background: #ebe1d2;
      padding: 0.3rem 1.2rem;
      border-radius: 2rem;
    }

    .disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .observer-panel {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
      margin: 0.8rem 0;
    }
    .observer-card {
      background: #f3ede4;
      border-radius: 1.2rem;
      padding: 0.5rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
    }

    .room-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      margin: 1rem 0;
    }
    .room-cell {
      aspect-ratio: 1/1;
      background: #f3ede6;
      border-radius: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      border: 2px solid #dacbbc;
      transition: 0.2s;
    }

    hr {
      border: 0.5px solid #e4d6c3;
      margin: 0.8rem 0;
    }

    @media (max-width: 500px) {
      .container {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <h1>
      entropy. what is it?
      <span>ΔS</span>
    </h1>
    <div id="dynamicContent"></div>
  </div>

  <script>
    (function() {
      // --- App state ---
      const TOTAL_STEPS = 4; // we have sections: 1-clump, 2-spread, 3-uncertainty, 4-subjective
      let currentStep = 1; // 1..4

      // For particle simulations (steps 1-3)
      let gridSize = 4; // 4x4 grid for particles
      let particles = []; // array of {row, col} indices
      
      // Clump mode: fixed square positions (top-left 3x3 block inside 4x4)
      const clumpPositions = [
        {r:0,c:0},{r:0,c:1},{r:0,c:2},
        {r:1,c:0},{r:1,c:1},{r:1,c:2},
        {r:2,c:0},{r:2,c:1},{r:2,c:2}
      ];
      
      // For spread state: random positions
      function generateRandomPositions(count=9) {
        const positions = [];
        const used = new Set();
        while(positions.length < count) {
          const r = Math.floor(Math.random() * 4);
          const c = Math.floor(Math.random() * 4);
          const key = `${r},${c}`;
          if(!used.has(key)) {
            used.add(key);
            positions.push({r,c});
          }
        }
        return positions;
      }

      // For uncertainty mode (step 3): ordered vs disordered reveal
      let uncertaintyMode = 'ordered'; // 'ordered' or 'disordered'
      let revealedCells = new Set(); // stores "r,c" strings
      
      // For subjective room (step 4)
      let roomObjects = [];
      let aliceSorted = false;
      let bobSorted = false;
      let currentView = 'alice'; // 'alice' or 'bob'

      // ----- Helper to render based on step -----
      function renderApp() {
        const container = document.getElementById('dynamicContent');
        if (!container) return;
        
        switch(currentStep) {
          case 1: renderClumpState(container); break;
          case 2: renderSpreadState(container); break;
          case 3: renderUncertainty(container); break;
          case 4: renderSubjective(container); break;
          default: break;
        }
      }

      // ----- Step 1: Clump state (low entropy) -----
      function renderClumpState(container) {
        particles = clumpPositions.map(p => ({...p}));
        const totalConfigs = 16; // 4x4 grid possible placements of 3x3 block? Actually fixed orientation: 16 ways.
        const explored = Math.min(5, totalConfigs); // static representation
        
        container.innerHTML = `
          <div class="stage-area">
            <div class="description">
              <p>🔹 <strong>What is entropy?</strong> A measure of disorder. It counts microscopic arrangements.</p>
              <p>Nine particles must clump in a 3×3 square. Only <span class="highlight">16 ways</span> exist.</p>
            </div>
            <div class="grid-box">
              <div class="grid" id="clumpGrid"></div>
              <div class="stats">
                <span>📊 <span class="highlight">5 / 16</span> configurations explored</span>
                <span class="progress-badge">Low entropy</span>
              </div>
              <div class="entropy-bar">
                <span style="font-size:0.9rem;">Low</span>
                <div class="bar-track"><div class="bar-fill" style="width:5%;"></div></div>
                <span style="font-size:0.9rem;">High</span>
              </div>
            </div>
            <div class="nav-buttons">
              <button disabled class="disabled">Previous</button>
              <span class="step-indicator">1 / 4</span>
              <button id="nextToStep2" class="primary">Next →</button>
            </div>
          </div>
        `;
        
        const gridEl = document.getElementById('clumpGrid');
        if (gridEl) drawParticleGrid(gridEl, particles);
        document.getElementById('nextToStep2')?.addEventListener('click', () => {
          currentStep = 2;
          renderApp();
        });
      }

      function drawParticleGrid(gridElement, particleList) {
        gridElement.innerHTML = '';
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            const isParticle = particleList.some(p => p.r === r && p.c === c);
            if (isParticle) {
              cell.classList.add('particle');
              cell.textContent = '●';
            }
            gridElement.appendChild(cell);
          }
        }
      }

      // ----- Step 2: Spread state (high entropy) -----
      function renderSpreadState(container) {
        if (particles.length !== 9 || currentStep !== 2) {
          particles = generateRandomPositions(9);
        }
        const totalConfigs = 94143280;
        const exploredCount = 39;
        
        container.innerHTML = `
          <div class="stage-area">
            <div class="description">
              <p>Now particles can occupy <strong>any square</strong>. There are <span class="highlight">94,143,280</span> arrangements.</p>
            </div>
            <div class="grid-box">
              <div class="grid" id="spreadGrid"></div>
              <div class="stats">
                <span>🔍 ${exploredCount} / 94,143,280 explored</span>
                <span class="progress-badge">High entropy</span>
              </div>
              <div class="entropy-bar">
                <span>Low</span>
                <div class="bar-track"><div class="bar-fill" style="width:85%;"></div></div>
                <span>High</span>
              </div>
            </div>
            <div class="nav-buttons">
              <button id="prevToStep1">← Previous</button>
              <span class="step-indicator">2 / 4</span>
              <button id="nextToStep3" class="primary">Next →</button>
            </div>
            <p style="margin-top:0.8rem; font-style:italic; color:#5f4a35;">Spread‑out states overwhelmingly more likely. Second law: entropy increases.</p>
          </div>
        `;
        
        const gridEl = document.getElementById('spreadGrid');
        if (gridEl) drawParticleGrid(gridEl, particles);
        
        document.getElementById('prevToStep1')?.addEventListener('click', ()=>{
          currentStep = 1;
          renderApp();
        });
        document.getElementById('nextToStep3')?.addEventListener('click', ()=>{
          currentStep = 3;
          uncertaintyMode = 'ordered';
          revealedCells.clear();
          renderApp();
        });
      }

      // ----- Step 3: Entropy as Uncertainty -----
      function renderUncertainty(container) {
        const isOrdered = uncertaintyMode === 'ordered';
        const particlePositions = isOrdered ? clumpPositions : generateRandomPositions(9);
        
        container.innerHTML = `
          <div class="stage-area">
            <div class="description">
              <p><strong>Entropy as uncertainty.</strong> Click squares to reveal particles.</p>
              <p>${isOrdered ? '🔹 Ordered clump: knowing one helps predict others.' : '🔸 Disordered: finding one tells little about the rest.'}</p>
            </div>
            <div class="grid-box">
              <div class="grid" id="uncertaintyGrid"></div>
              <div class="stats">
                <span>🔎 Revealed: ${revealedCells.size} / 9</span>
                <button id="toggleUncertaintyMode" style="padding:0.4rem 1rem;">Switch to ${isOrdered ? 'Disordered' : 'Ordered'}</button>
              </div>
            </div>
            <div class="nav-buttons">
              <button id="prevToStep2">← Previous</button>
              <span class="step-indicator">3 / 4</span>
              <button id="nextToStep4" class="primary">Next →</button>
            </div>
          </div>
        `;
        
        const gridEl = document.getElementById('uncertaintyGrid');
        if (gridEl) {
          gridEl.innerHTML = '';
          for (let r = 0; r < 4; r++) {
            for (let c = 0; c < 4; c++) {
              const cell = document.createElement('div');
              cell.className = 'cell';
              const key = `${r},${c}`;
              const hasParticle = particlePositions.some(p => p.r === r && p.c === c);
              const isRevealed = revealedCells.has(key);
              
              if (isRevealed) {
                cell.classList.add('revealed');
                cell.textContent = hasParticle ? '●' : '○';
                if (hasParticle) cell.classList.add('particle');
              } else {
                cell.textContent = '?';
                cell.style.cursor = 'pointer';
                cell.addEventListener('click', () => {
                  revealedCells.add(key);
                  renderApp();
                });
              }
              gridEl.appendChild(cell);
            }
          }
        }
        
        document.getElementById('toggleUncertaintyMode')?.addEventListener('click', ()=>{
          uncertaintyMode = uncertaintyMode === 'ordered' ? 'disordered' : 'ordered';
          revealedCells.clear();
          renderApp();
        });
        document.getElementById('prevToStep2')?.addEventListener('click', ()=>{
          currentStep = 2;
          renderApp();
        });
        document.getElementById('nextToStep4')?.addEventListener('click', ()=>{
          currentStep = 4;
          initRoom();
          renderApp();
        });
      }

      // ----- Step 4: Subjective entropy (room) -----
      function initRoom() {
        // objects with shape and color
        const shapes = ['●', '■', '▲', '◆'];
        const colors = ['red', 'blue', 'green', 'gold'];
        roomObjects = [];
        // create 8 objects: mix shapes/colors
        for (let i = 0; i < 8; i++) {
          roomObjects.push({
            shape: shapes[i % 4],
            color: colors[Math.floor(i/2) % 4],
            id: i
          });
        }
        // shuffle
        roomObjects.sort(() => Math.random() - 0.5);
        aliceSorted = false;
        bobSorted = false;
        currentView = 'alice';
      }

      function sortByColor() {
        const order = ['red', 'blue', 'green', 'gold'];
        roomObjects.sort((a,b) => order.indexOf(a.color) - order.indexOf(b.color));
        aliceSorted = true;
      }
      function sortByShape() {
        const order = ['●', '■', '▲', '◆'];
        roomObjects.sort((a,b) => order.indexOf(a.shape) - order.indexOf(b.shape));
        bobSorted = true;
      }

      function renderSubjective(container) {
        if (roomObjects.length === 0) initRoom();
        
        const aliceEntropy = aliceSorted ? 'Low' : 'High';
        const bobEntropy = bobSorted ? 'Low' : 'High';
        
        container.innerHTML = `
          <div class="stage-area">
            <div class="description">
              <p><strong>Entropy is subjective.</strong> Order depends on what observer knows.</p>
              <div class="observer-panel">
                <div class="observer-card">👩 Alice: sees <span style="color:#b84c3b;">colors</span></div>
                <div class="observer-card">👨 Bob: sees <span style="font-weight:bold;">shapes</span></div>
              </div>
            </div>
            <div class="room-grid" id="roomGrid"></div>
            <div style="display:flex; justify-content: space-between; margin:0.6rem 0;">
              <div><span>Alice's entropy:</span> <strong>${aliceEntropy}</strong></div>
              <div><span>Bob's entropy:</span> <strong>${bobEntropy}</strong></div>
            </div>
            <div class="nav-buttons" style="flex-wrap:wrap;">
              <button id="sortAliceBtn">🎨 Sort for Alice (color)</button>
              <button id="sortBobBtn">🔷 Sort for Bob (shape)</button>
              <button id="toggleViewBtn">👁️ ${currentView==='alice'?'Switch to Bob’s view':'Switch to Alice’s view'}</button>
            </div>
            <div style="margin-top:1rem; display:flex; justify-content:space-between;">
              <button id="prevToStep3">← Previous</button>
              <span class="step-indicator">4 / 4</span>
              <button id="restartDemo" class="primary">↺ Next demo</button>
            </div>
            <p style="font-size:0.9rem; margin-top:0.8rem;">“Entropy measures ignorance.” — Observer-dependent reality.</p>
          </div>
        `;
        
        const roomGrid = document.getElementById('roomGrid');
        if (roomGrid) {
          roomGrid.innerHTML = '';
          roomObjects.forEach(obj => {
            const cell = document.createElement('div');
            cell.className = 'room-cell';
            cell.textContent = obj.shape;
            if (currentView === 'alice') {
              cell.style.color = obj.color;
              cell.style.backgroundColor = '#faf6f0';
            } else {
              cell.style.color = '#2d2d2d';
              cell.style.backgroundColor = '#f5ede1';
            }
            roomGrid.appendChild(cell);
          });
        }
        
        document.getElementById('sortAliceBtn')?.addEventListener('click', ()=>{
          sortByColor();
          renderApp();
        });
        document.getElementById('sortBobBtn')?.addEventListener('click', ()=>{
          sortByShape();
          renderApp();
        });
        document.getElementById('toggleViewBtn')?.addEventListener('click', ()=>{
          currentView = currentView === 'alice' ? 'bob' : 'alice';
          renderApp();
        });
        document.getElementById('prevToStep3')?.addEventListener('click', ()=>{
          currentStep = 3;
          renderApp();
        });
        document.getElementById('restartDemo')?.addEventListener('click', ()=>{
          currentStep = 1;
          revealedCells.clear();
          initRoom();
          renderApp();
        });
      }

      // initial render
      renderApp();
    })();
  </script>
</body>
</html>
